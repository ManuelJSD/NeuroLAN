<ion-app>
  <ion-split-pane
    contentId="main-content"
    [when]="uiService.splitPaneCondition()"
  >
    <ion-menu 
      menuId="main-menu"
      contentId="main-content" 
      class="neuro-menu"
      (ionWillOpen)="uiService.isDesktopSidebarOpen.set(true)"
      (ionWillClose)="uiService.isDesktopSidebarOpen.set(false)"
    >
      <app-sidebar></app-sidebar>
    </ion-menu>
    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
