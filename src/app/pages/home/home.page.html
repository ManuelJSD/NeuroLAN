<ion-content class="home-content">
  <div class="home-wrapper">
    <!-- Floating button: Only appears if the menu is closed. -->
    @if (uiService.shouldShowToggleBtn()) {
    <div class="floating-top-controls">
      <button
        class="icon-action-btn"
        (click)="uiService.toggleDesktopSidebar()"
        title="Mostrar menú"
      >
        <svg
          viewBox="0 0 24 24"
          width="22"
          height="22"
          stroke="currentColor"
          stroke-width="2"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="9" y1="3" x2="9" y2="21"></line>
        </svg>
      </button>
    </div>
    }

    <!-- Zona central de bienvenida -->
    <main class="home-main">
      <!-- Título de bienvenida -->
      <section class="welcome-section">
        <h1 class="welcome-title">{{ 'HOME.TITLE' | translate }}</h1>
        <p class="welcome-subtitle">{{ 'HOME.SUBTITLE' | translate }}</p>
      </section>

      <!-- Sugerencias de prompts -->
      <div class="suggestions-row">
        @for (key of suggestions; track key) {
        <button class="suggestion-chip" (click)="useSuggestion(key)">
          {{ key | translate }}
        </button>
        }
      </div>

      <!-- Barra de input principal con el componente reutilizable -->
      <div class="chat-input-wrapper">
        <app-chat-input
          [models]="models"
          [selectedModelKey]="selectedModelKey"
          [webSearchEnabled]="webSearchEnabled"
          [showTemporaryChat]="true"
          [placeholder]="'HOME.PLACEHOLDER'"
          [sendButtonTitle]="'HOME.SEND'"
          [(text)]="userInput"
          (send)="onSendMessage($event)"
          (modelChange)="onModelChange($event)"
          (reloadModels)="loadModels()"
        ></app-chat-input>
      </div>
    </main>
  </div>
</ion-content>
