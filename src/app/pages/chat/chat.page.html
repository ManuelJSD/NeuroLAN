<ion-list>
  <ion-item>
    <ion-select placeholder="Models" [(ngModel)]="selectedModelKey">
      <ion-select-option *ngFor="let model of models" [value]="model.key">{{ model.display_name }}</ion-select-option>
    </ion-select>
  </ion-item>
</ion-list>

<ion-content>

  <ion-list>
    <ion-item *ngFor="let msg of messages" [class.user]="msg.role === 'user'" [class.assistant]="msg.role === 'assistant'">
      <ion-label>
        <h3>{{ msg.role === 'user' ? 'You' : 'Assistant' }}</h3>
        <p>{{ msg.content }}</p>
      </ion-label>
    </ion-item>
  </ion-list>

  <ion-item *ngIf="errorMessage" color="danger">
    <ion-label>{{ errorMessage }}</ion-label>
  </ion-item>

  <div class="chat-input">
    <ion-item lines="none">
      <ion-textarea
        autoGrow="true"
        [(ngModel)]="userInput"
        placeholder="Write your message..."
      ></ion-textarea>
    </ion-item>
    <ion-button
      expand="block"
      (click)="sendMessage()"
      [disabled]="isSending"
    >
      Send
    </ion-button>
  </div>

</ion-content>
