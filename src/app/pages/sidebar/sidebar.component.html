<ion-content class="menu-content">
  <!-- Sticky Header -->
  <div class="sidebar-sticky-header">
    <!-- Branding Header -->
    <div class="menu-brand">
      <div class="brand-logo-wrapper">
        <img
          class="brand-logo"
          src="assets/icon/favicon.png"
          alt="NeuroLAN logo"
        />
        <div class="brand-logo-glow"></div>
      </div>
      <div class="brand-text">
        <span class="brand-name">NeuroLAN</span>
        <span class="brand-subtitle">{{ "MENU.LOCAL_AI" | translate }}</span>
      </div>

      <!-- Button to collapse the menu -->
      <button
        class="icon-action-btn collapse-btn"
        (click)="uiService.toggleDesktopSidebar()"
      >
        <svg
          viewBox="0 0 24 24"
          width="22"
          height="22"
          stroke="currentColor"
          stroke-width="2"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="9" y1="3" x2="9" y2="21"></line>
          <path d="m15 15-3-3 3-3"></path>
        </svg>
      </button>
    </div>

    <!-- New Chat Button -->
    <div class="new-chat-wrapper">
      <ion-menu-toggle auto-hide="false">
        <a class="new-chat-btn" routerLink="/chat" routerDirection="root">
          <ion-icon name="add-circle-outline" class="new-chat-icon"></ion-icon>
          <span>{{ "MENU.NEW_CHAT" | translate }}</span>
        </a>
      </ion-menu-toggle>
    </div>
  </div>

  <!-- Nav Section -->
  <nav class="menu-nav">
    <p class="menu-section-label">{{ "MENU.NAVIGATION" | translate }}</p>
    <ul class="menu-list">
      @for (p of appPages; track p; let i = $index) {
        <li class="menu-list-item">
          <ion-menu-toggle auto-hide="false">
            <ion-item
              routerDirection="root"
              [routerLink]="[p.url]"
              lines="none"
              detail="false"
              routerLinkActive="active-item"
              class="menu-item"
            >
              <div class="menu-item-icon" slot="start">
                <ion-icon [name]="p.icon"></ion-icon>
              </div>
              <ion-label class="menu-item-label">{{
                "MENU.PAGES." + p.title.toUpperCase() | translate
              }}</ion-label>
              <div class="menu-item-indicator" slot="end"></div>
            </ion-item>
          </ion-menu-toggle>
        </li>
      }
    </ul>
  </nav>

  <!-- History Section -->
  <div class="menu-history">
    <p class="menu-section-label">
      <ion-icon name="time-outline" class="section-icon"></ion-icon>
      {{ "MENU.RECENT" | translate }}
    </p>
    <div class="history-list-wrapper">
      <app-conversations></app-conversations>
    </div>
  </div>
</ion-content>
