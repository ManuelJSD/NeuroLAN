<ion-content class="home-content">
  <div class="home-wrapper">
    <!-- Floating button: Only appears if the menu is closed. -->
    @if (!uiService.isDesktopSidebarOpen()) {
    <div class="floating-top-controls">
      <button
        class="icon-action-btn"
        (click)="uiService.toggleDesktopSidebar()"
        title="Mostrar menú"
      >
        <svg
          viewBox="0 0 24 24"
          width="22"
          height="22"
          stroke="currentColor"
          stroke-width="2"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="9" y1="3" x2="9" y2="21"></line>
        </svg>
      </button>
    </div>
    }

    <!-- Zona central de bienvenida -->
    <main class="home-main">
      <!-- Título de bienvenida -->
      <section class="welcome-section">
        <h1 class="welcome-title">{{ 'HOME.TITLE' | translate }}</h1>
        <p class="welcome-subtitle">{{ 'HOME.SUBTITLE' | translate }}</p>
      </section>

      <!-- Sugerencias de prompts -->
      <div class="suggestions-row">
        @for (key of suggestions; track key) {
        <button class="suggestion-chip" (click)="useSuggestion(key)">
          {{ key | translate }}
        </button>
        }
      </div>

      <!-- Barra de input principal -->
      <div class="input-card">
        <!-- Text Area -->
        <ion-textarea
          class="main-input"
          autoGrow="true"
          rows="1"
          [(ngModel)]="userInput"
          [placeholder]="'HOME.PLACEHOLDER' | translate"
          (keydown.enter)="onEnterKey($any($event))"
        ></ion-textarea>

        <!-- Bottom bar: model selector + send button -->
        <div class="input-toolbar">
          <!-- Model Select -->
          <div class="model-selector-wrapper">
            <ion-select
              class="model-select"
              interface="popover"
              [placeholder]="'HOME.SELECT_MODEL' | translate"
              [(ngModel)]="selectedModelKey"
            >
              @for (model of models; track model.id) {
              <ion-select-option [value]="model.id"
                >{{ model.id }}</ion-select-option
              >
              } @empty {
              <ion-select-option disabled
                >{{ 'CHAT.NO_MODELS' | translate }}</ion-select-option
              >
              }
            </ion-select>

            <button
              class="reload-btn"
              (click)="loadModels()"
              [title]="'HOME.RELOAD_MODELS' | translate"
            >
              <ion-icon name="refresh-outline" aria-hidden="true"></ion-icon>
            </button>
          </div>

          <!-- Send Button -->
          <button
            class="send-btn"
            (click)="sendMessage()"
            [disabled]="!userInput"
            [title]="'HOME.SEND' | translate"
          >
            <svg
              viewBox="0 0 24 24"
              width="18"
              height="18"
              stroke="currentColor"
              stroke-width="2.5"
              fill="none"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <line x1="12" y1="19" x2="12" y2="5"></line>
              <polyline points="5 12 12 5 19 12"></polyline>
            </svg>
          </button>
        </div>
      </div>
    </main>
  </div>
</ion-content>
