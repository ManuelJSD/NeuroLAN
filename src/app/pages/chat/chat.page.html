<ion-list>
  <ion-item>
    <ion-select placeholder="Models" [(ngModel)]="selectedModelKey">
      <ion-select-option *ngFor="let model of models" [value]="model.id">{{ model.id }}</ion-select-option>
    </ion-select>
  </ion-item>
</ion-list>

<div *ngIf="usage">
  <ion-chip>
    <ion-label>
      Total tokens: {{ usage.total_tokens }} | Prompt: {{ usage.prompt_tokens }} | Completion: {{ usage.completion_tokens }}
    </ion-label>
  </ion-chip>
</div>

<ion-content>

  <ion-list>
    <ion-item *ngFor="let msg of messages" [class.user]="msg.role === 'user'" [class.assistant]="msg.role === 'assistant'">
      <ion-label>
        <h3>{{ msg.role === 'user' ? 'You' : 'Assistant' }}</h3>
        <markdown *ngIf="msg.role === 'assistant'" [data]="msg.content"></markdown>
        <p *ngIf="msg.role === 'user'" class="message-content">{{ msg.content }}</p>
      </ion-label>
    </ion-item>
  </ion-list>

  <ion-item lines="none" *ngIf="isSending">
    <ion-label>Thinking...</ion-label>
    <ion-spinner name="dots" slot="end"></ion-spinner>
  </ion-item>

  <ion-item *ngIf="errorMessage" color="danger">
    <ion-label>{{ errorMessage }}</ion-label>
  </ion-item>

  <div class="chat-input">
    <ion-item lines="none">
      <ion-textarea
        autoGrow="true"
        [(ngModel)]="userInput"
        placeholder="Write your message..."
      ></ion-textarea>
    </ion-item>
    <ion-button
      expand="block"
      (click)="sendMessage()"
      [disabled]="isSending"
    >
      Send
    </ion-button>
  </div>

</ion-content>
