<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>settings</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">settings</ion-title>
    </ion-toolbar>
  </ion-header>

<form [formGroup]="settingsForm">
<ion-list>
  <ion-item>
    <ion-input label="Server Address" formControlName="serverAddress" placeholder="http://localhost:11434"></ion-input>
  </ion-item>
</ion-list>

<ion-button expand="block" (click)="saveSettings()">Save</ion-button>
</form>

  <ion-toast
    [isOpen]="isToastOpen"
    [message]="toastMessage"
    [duration]="5000"
    (didDismiss)="setOpen(false)"
  ></ion-toast>

</ion-content>
