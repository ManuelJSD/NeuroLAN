<ion-content class="home-content">
    <div class="home-wrapper">

      <!-- Zona central de bienvenida -->
      <main class="home-main">

        <!-- Título de bienvenida -->
        <section class="welcome-section">
          <h1 class="welcome-title">{{ 'HOME.TITLE' | translate }}</h1>
          <p class="welcome-subtitle">{{ 'HOME.SUBTITLE' | translate }}</p>
        </section>

        <!-- Sugerencias de prompts -->
        <div class="suggestions-row">
          @for (key of suggestions; track key) {
            <button class="suggestion-chip" (click)="useSuggestion(key)">
              {{ key | translate }}
            </button>
          }
        </div>

        <!-- Barra de input principal -->
        <div class="input-card">

          <!-- Área de texto -->
          <ion-textarea
            class="main-input"
            autoGrow="true"
            rows="1"
            [(ngModel)]="userInput"
            [placeholder]="'HOME.PLACEHOLDER' | translate"
            (keydown.enter)="onEnterKey($any($event))"
          ></ion-textarea>

          <!-- Barra inferior: selector de modelo + botón enviar -->
          <div class="input-toolbar">

            <!-- Selector de modelo -->
            <div class="model-selector-wrapper">
              <ion-select
                class="model-select"
                interface="popover"
                [placeholder]="'HOME.SELECT_MODEL' | translate"
                [(ngModel)]="selectedModelKey"
              >
                @for (model of models; track model.id) {
                  <ion-select-option [value]="model.id">{{ model.id }}</ion-select-option>
                }
              </ion-select>

              <button class="reload-btn" (click)="loadModels()" [title]="'HOME.RELOAD_MODELS' | translate">
                <ion-icon name="refresh-outline" aria-hidden="true"></ion-icon>
              </button>
            </div>

            <!-- Botón de enviar -->
            <button
              class="send-btn"
              (click)="sendMessage()"
              [disabled]="!userInput"
              [title]="'HOME.SEND' | translate"
            >
              <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="12" y1="19" x2="12" y2="5"></line>
                <polyline points="5 12 12 5 19 12"></polyline>
              </svg>
            </button>

          </div>
        </div>

      </main>

    </div>
</ion-content>
