<div class="conversations-wrapper">
  @for (conversation of searchResults ?? (conversations$ | async) ?? []; track
  conversation.id) {
  <li
    class="history-item"
    [routerLink]="['/chat', conversation.id]"
    routerLinkActive="active"
  >
    <ion-icon name="chatbubble-outline" class="history-icon"></ion-icon>
    <span class="history-label">{{ conversation.title }}</span>
    <ion-button
      class="options-button"
      fill="clear"
      (click)="presentActionSheet(conversation, $event)"
    >
      <ion-icon slot="icon-only" name="ellipsis-vertical-outline"></ion-icon>
    </ion-button>
  </li>
  } @empty {
  <li class="history-empty">{{ 'CONVERSATIONS.EMPTY' | translate }}</li>
  }
</div>

<!-- Import / Export Actions -->
<div class="data-actions">
  <button class="data-action-btn export-btn" (click)="exportConversations()">
    <ion-icon name="download-outline"></ion-icon>
    <span>{{ 'CONVERSATIONS.EXPORT' | translate }}</span>
  </button>
  <button class="data-action-btn import-btn" (click)="importConversations()">
    <ion-icon name="cloud-upload-outline"></ion-icon>
    <span>{{ 'CONVERSATIONS.IMPORT' | translate }}</span>
  </button>
</div>

<ion-alert
  [isOpen]="isDeleteAlertOpen"
  class="delete-alert"
  header="{{ 'CHAT.ALERT_DELETE' | translate }}"
  [buttons]="[
    { text: 'CHAT.ALERT_NO' | translate, role: 'cancel' },
    { text: 'CHAT.ALERT_YES' | translate, role: 'confirm' }
  ]"
  (didDismiss)="onDeleteAlertDismiss($event)"
>
</ion-alert>

<ion-alert
  [isOpen]="isEditAlertOpen"
  class="present-alert"
  header="{{ 'CHAT.ALERT_EDIT' | translate }}"
  [inputs]="alertEditInputs"
  [buttons]="[
    { text: 'CHAT.ALERT_NO' | translate, role: 'cancel' },
    { text: 'CHAT.ALERT_YES' | translate, role: 'confirm' }
  ]"
  (didDismiss)="onEditAlertDismiss($event)"
></ion-alert>
