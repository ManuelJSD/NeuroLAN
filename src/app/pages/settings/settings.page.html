<div class="settings-wrapper">

  <!-- Page Header -->
  <header class="settings-header">
    <div class="header-content">
      <div class="header-icon">
        <ion-icon name="settings-outline"></ion-icon>
      </div>
      <div class="header-text">
        <h1 class="header-title">Settings</h1>
        <p class="header-subtitle">Adjust the connection parameters</p>
      </div>
    </div>
  </header>

  <ion-content class="settings-content">
    <div class="settings-container">

      <!-- Connection Card -->
      <div class="settings-card">
        <div class="card-header">
          <div class="card-icon">
            <ion-icon name="server-outline"></ion-icon>
          </div>
          <div class="card-header-text">
            <h2 class="card-title">LM Studio Server</h2>
            <p class="card-subtitle">Local AI model server address</p>
          </div>
        </div>

        <form [formGroup]="settingsForm" class="settings-form">
          <div class="field-group">
            <label class="field-label" for="serverAddress">Server URL</label>
            <div class="field-input-wrapper">
              <ion-icon name="globe-outline" class="field-prefix-icon"></ion-icon>
              <ion-input
                id="serverAddress"
                class="field-input"
                formControlName="serverAddress"
                placeholder="http://127.0.0.1:1234"
              ></ion-input>
            </div>
            <p class="field-hint">Make sure LM Studio is running with the server enabled.</p>
          </div>

          <ion-button
            class="save-button"
            expand="block"
            (click)="saveSettings()"
          >
            <ion-icon name="checkmark-circle-outline" slot="start"></ion-icon>
            Save Settings
          </ion-button>
        </form>
      </div>

      <!-- Info Card -->
      <div class="settings-card info-card">
        <div class="info-row">
          <ion-icon name="information-circle-outline" class="info-icon"></ion-icon>
          <div class="info-text">
            <strong>How to set up LM Studio?</strong>
            <p>Open LM Studio → "Local Server" → Enable the server → Copy the URL shown.</p>
          </div>
        </div>
      </div>

    </div>
  </ion-content>

  <!-- Toast -->
  <ion-toast
    [isOpen]="isToastOpen"
    [message]="toastMessage"
    [duration]="3000"
    (didDismiss)="setOpen(false)"
    position="bottom"
  ></ion-toast>

</div>
